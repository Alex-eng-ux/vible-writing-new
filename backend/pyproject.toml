[project]
name = "novel-studio-backend"
version = "0.1.0"
description = "Continuous novel writing studio backend (V1 engineering scaffold)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "httpx>=0.27,<0.28",
    "langchain-core>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "langsmith>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.25",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP040"]